<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Uzskaite">
    <title>Darbinieku Uzskaites Sistēma</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --active-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 20px;
            color: #0f172a;
        }

        /* Controls / Page switching */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        .page-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            max-width: 100%;
        }

        .tab-btn {
            background: #e2e8f0;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .action-btn.new-page {
            background: var(--success-color);
        }

        .action-btn.danger {
            background: var(--danger-color);
        }

        /* Input section */
        .add-worker-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .add-worker-form input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        /* Table styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 8px 6px;
            border: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background-color: #f1f5f9;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        td.worker-name {
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            min-width: 130px;
        }

        /* Compact status buttons */
        .status-btn {
            width: 100%;
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #f8fafc;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.15s ease;
        }

        .status-btn.par-btn.active {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .status-btn.pret-btn.active {
            background-color: var(--danger-color);
            color: white;
            border-color: var(--danger-color);
        }

        .status-btn.inactive {
            opacity: 0.6;
        }

        .total-cell {
            font-size: 15px;
            font-weight: bold;
            background-color: #f8fafc;
        }

        .total-par {
            color: var(--success-color);
        }

        .total-pret {
            color: var(--danger-color);
        }

        .footer-actions {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            th, td {
                padding: 6px 4px;
                font-size: 12px;
            }
            .status-btn {
                padding: 6px 2px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Darbinieku Uzskaites Sistēma</h1>

    <!-- Page navigation -->
    <div class="controls">
        <div class="page-tabs" id="pageTabs"></div>
        <button class="action-btn new-page" onclick="createNewPage()">+ Jauna lapa</button>
    </div>

    <!-- New worker input -->
    <div class="add-worker-form">
        <input type="text" id="newWorkerName" placeholder="Ievadiet darbinieka vārdu...">
        <button class="action-btn" onclick="addWorker()">Pievienot darbinieku</button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="width: 28%;">Vārds</th>
                    <th style="width: 18%;">Par</th>
                    <th style="width: 18%;">Pret</th>
                    <th style="width: 18%;">Kopā "Par"</th>
                    <th style="width: 18%;">Kopā "Pret"</th>
                </tr>
            </thead>
            <tbody id="workerTableBody">
                <!-- Dynamic content -->
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
        <button class="action-btn danger" onclick="resetAllData()">Atiestatīt visus datus</button>
        <button class="action-btn" onclick="exportData()">Eksportēt datus (JSON)</button>
    </div>
</div>

<script>
    // State management
    let state = {
        workers: [], // [{ id: 1, name: 'Vārds' }]
        pages: [],   // [{ id: 1, name: '1. lapa', votes: { workerId: 'par' | 'pret' | null } }]
        currentPageId: 1
    };

    // Load from LocalStorage
    function loadState() {
        const saved = localStorage.getItem('worker_app_state_v2');
        if (saved) {
            try {
                state = JSON.parse(saved);
            } catch (e) {
                console.error("Kļūda ielādējot datus", e);
                initDefaultState();
            }
        } else {
            initDefaultState();
        }
        render();
    }

    function initDefaultState() {
        state = {
            workers: [
                { id: 1, name: 'Jānis Bērziņš' },
                { id: 2, name: 'Pēteris Kļaviņš' }
            ],
            pages: [
                { id: 1, name: '1. lapa', votes: {} }
            ],
            currentPageId: 1
        };
        saveState();
    }

    function saveState() {
        localStorage.setItem('worker_app_state_v2', JSON.stringify(state));
    }

    function render() {
        renderTabs();
        renderTable();
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('pageTabs');
        tabsContainer.innerHTML = '';
        state.pages.forEach(page => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${page.id === state.currentPageId ? 'active' : ''}`;
            btn.innerText = page.name;
            btn.onclick = () => {
                state.currentPageId = page.id;
                saveState();
                render();
            };
            tabsContainer.appendChild(btn);
        });
    }

    function renderTable() {
        const tbody = document.getElementById('workerTableBody');
        tbody.innerHTML = '';

        const currentPage = state.pages.find(p => p.id === state.currentPageId) || state.pages[0];

        state.workers.forEach(worker => {
            const tr = document.createElement('tr');

            // 1. Column: Name
            const tdName = document.createElement('td');
            tdName.className = 'worker-name';
            tdName.innerText = worker.name;
            tr.appendChild(tdName);

            const currentVote = currentPage.votes[worker.id] || null;

            // 2. Column: "Par" button
            const tdPar = document.createElement('td');
            const btnPar = document.createElement('button');
            btnPar.className = `status-btn par-btn ${currentVote === 'par' ? 'active' : ''}`;
            btnPar.innerText = currentVote === 'par' ? '✓ Par' : 'par';
            btnPar.onclick = () => toggleVote(worker.id, 'par');
            tdPar.appendChild(btnPar);
            tr.appendChild(tdPar);

            // 3. Column: "Pret" button
            const tdPret = document.createElement('td');
            const btnPret = document.createElement('button');
            btnPret.className = `status-btn pret-btn ${currentVote === 'pret' ? 'active' : ''}`;
            btnPret.innerText = currentVote === 'pret' ? '✕ Pret' : 'pret';
            btnPret.onclick = () => toggleVote(worker.id, 'pret');
            tdPret.appendChild(btnPret);
            tr.appendChild(tdPret);

            // Calculate totals across all pages
            let totalPar = 0;
            let totalPret = 0;

            state.pages.forEach(p => {
                if (p.votes[worker.id] === 'par') totalPar++;
                if (p.votes[worker.id] === 'pret') totalPret++;
            });

            // 4. Column: Total "Par"
            const tdTotalPar = document.createElement('td');
            tdTotalPar.className = 'total-cell total-par';
            tdTotalPar.innerText = totalPar;
            tr.appendChild(tdTotalPar);

            // 5. Column: Total "Pret"
            const tdTotalPret = document.createElement('td');
            tdTotalPret.className = 'total-cell total-pret';
            tdTotalPret.innerText = totalPret;
            tr.appendChild(tdTotalPret);

            tbody.appendChild(tr);
        });
    }

    function toggleVote(workerId, type) {
        const page = state.pages.find(p => p.id === state.currentPageId);
        if (!page) return;

        if (!page.votes) page.votes = {};

        if (page.votes[workerId] === type) {
            // Cancel vote if clicked again
            page.votes[workerId] = null;
        } else {
            // Assign new vote (mutually exclusive)
            page.votes[workerId] = type;
        }

        saveState();
        render();
    }

    function addWorker() {
        const input = document.getElementById('newWorkerName');
        const name = input.value.trim();
        if (!name) return;

        const newId = Date.now();
        state.workers.push({ id: newId, name: name });
        input.value = '';
        saveState();
        render();
    }

    function createNewPage() {
        const newPageId = Date.now();
        const pageNumber = state.pages.length + 1;
        const newPage = {
            id: newPageId,
            name: `${pageNumber}. lapa`,
            votes: {} // All workers inactive by default in new page
        };
        state.pages.push(newPage);
        state.currentPageId = newPageId;
        saveState();
        render();
    }

    function resetAllData() {
        if (confirm("Vai tiešām vēlaties dzēst visus datus un sākt no jauna?")) {
            localStorage.removeItem('worker_app_state_v2');
            initDefaultState();
            render();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `uzskaite_dati_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // Initialize on load
    window.onload = loadState;
</script>

</body>
</html>
